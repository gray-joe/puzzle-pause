# Ruff configuration for backend
# https://docs.astral.sh/ruff/

line-length = 88
target-version = "py313"

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[lint.per-file-ignores]
# Sentry init must happen before other imports
"app/main.py" = ["E402"]
# Timezone setup happens before imports
"app/routers/puzzle.py" = ["E402"]

[lint.isort]
known-first-party = ["app"]

[format]
quote-style = "double"
indent-style = "space"
